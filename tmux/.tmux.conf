# -------- General settings {{{
#------------------------------

# tmux display things in 256 colors
set -g default-terminal "xterm-256color"

# fix True 256 colors or something related to that
set -ga terminal-overrides ",tmux-256color:Tc,xterm-256color:Tc"

set -g history-limit 20000

# make delay shorter
set -sg escape-time 0

# Time in miliseconds between multiple commands to be considered as part
# of the same chain and, thus, not require another invocation of the
# <prefix>.  See the keybindings section below for all actions defined
# with the `-r` flag.
set -g repeat-time 300

# vi-like bindings in commandline
set -g status-keys vi
set -g mode-keys vi

# }}}
# -------- Key Bindings {{{
# -------------------------

# unbind default prefix and set it to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# reload tmux configs
unbind r
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# quickly open a new session with specified name
bind N command-prompt -p "Name of new session: " "new-session -s '%%'"

# tile all windows
unbind =
bind = select-layout tiled

# create new with with a prompt for window name
bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# because we're using C-{h,j,k,l} to move between tabs, we set <prefix>-l to send
# the actual Ctrl+L to the shell for 'clear screen' functionality
bind l send-keys 'C-l'

# prefix key + Ctrl+W open tree with preview for choosing session
bind C-W choose-tree -Zs

# Alt+z - zoom in/out into the current pane.
bind -n M-z resize-pane -Z

# split window and fix path for tmux 1.9
bind | split-window -h -c "#{pane_current_path}" # horizontal split active pane
bind - split-window -v -c "#{pane_current_path}" # vertical split active pane
bind \\ split-window -fh -c '#{pane_current_path}' # horizontal for whole screen
bind _ split-window -fv -c '#{pane_current_path}' # vertical for whole screen

# Create splits in PWD with Vim equivalent keys
# <prefix>+[s|S] or <prefix>-[v|V]
bind -r v split-window -h -p 50 -c '#{pane_current_path}' # horizontally split active pane
bind -r s split-window -v -p 50 -c '#{pane_current_path}' # vertically split active pane
bind -r V split-window -fh -c '#{pane_current_path}' # horizontal for whole screen
bind -r S split-window -fv -c '#{pane_current_path}' # vertical for whole screen

unbind x
bind x kill-pane
bind X kill-window

# Toggle input sync across panes (displays status when invoked).  The
# use of <prefix>a is a mnemonic for "all".
#bind a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"
bind a set-window-option synchronize-panes

# Alt-{h,l} or Alt-{Left,Right} to switch windows directly
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-Left previous-window
bind -n M-Right next-window

# Alt+Shift+{Left,Right} move window left/right AND keep focus on it
# (swap-window leaves focus on the index, not the moved window — the trailing
# select-window follows the window so repeated presses keep moving it)
bind -nr M-S-Left swap-window -t -1 \; select-window -t -1
bind -nr M-S-Right swap-window -t +1 \; select-window -t +1

# Switch windows using <prefix>-Arrow{left,right}.
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Resize panes with <prefix>Ctrl-{h,j,k,l}.  Omit/adjust the number for
# finer adjustments.
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Alt+{H,J,K,L} aka Alt+Shift+{h,j,k,l} select pane
bind -nr M-H select-pane -L
bind -nr M-J select-pane -D
bind -nr M-K select-pane -U
bind -nr M-L select-pane -R

# Ctrl+{arrow keys} - select pane
bind -n C-Left select-pane -L
bind -n C-Down select-pane -D
bind -n C-Up select-pane -U
bind -n C-Right select-pane -R

# enable mouse support for switching panes/windows and scroll in copy mode
set -g mouse on

# prefix+m: toggle tmux mouse. Off lets iTerm2 do native (no-modifier) select +
# Cmd+C; on = tmux mouse (pane/status/window clicks, copy-mode drag). NOTE: in a
# pane running a mouse-reporting app (Claude/vim/htop/less) the app keeps iTerm2
# captured even when this is off, so native select needs Option held regardless.
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"

# move with ctrl + left/right by word
set -g extended-keys on

# pass terminal focus in/out to apps (Claude Code uses it)
set -g focus-events on

# }}}
# -------- Copy & Paste {{{
# -------------------------

# Detect clipboard command: pbcopy on macOS, xclip on Linux
if-shell "command -v pbcopy" {
    set -g @clipboard "pbcopy"
} {
    set -g @clipboard "xclip -in -selection clipboard"
}

# vi copy-mode bindings: v to start selection, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{@clipboard}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@clipboard}"

# }}}
# -------- User Interface {{{
# -----------------------------------

# Title and window settings
# NOTE auto rename is disabled for the given window upon manual rename.
set -g set-titles on # string shown on titlebars or programs such as `xwininfo`
set -g set-titles-string "#T" # title format
set -g automatic-rename on # name windows with <prefix>, (sessions with <prefix>$)

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
set -g aggressive-resize on # manpage says "on" is bad for shells…

# Start indices from 1 for both windows and panes.  Makes it easier for
# direct navigation.  Also renumber windows.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Feedback (numbers represent miliseconds)
set -g display-panes-time 1200 # indicators for `display-panes` command
set -g display-time 1200 # use 0 to keep status line messages until key press

# Alerts
set -g monitor-bell on # check for terminal bell
set -g monitor-activity on # check for activity
set -g bell-action any # monitor all windows
set -g activity-action other # monitor activity in other windows NOTE DO NOT TRACK CURRENT
set -g visual-activity off # no status-line popup — activity shows as a coloured pill until visited
set -g visual-bell on # show message, make no sound

# NOTE: pane-border, message, pane-number, clock and bell COLOURS now live
# in the day/night theme files (~/.config/tmux/theme-{mocha,latte}.conf),
# sourced at the bottom of this config under "Day/night theme".
set -g clock-mode-style 24 # time format

# }}}
# -------- Status bar (layout — colours are in the theme files) {{{
# -----------------------

# Interval to update status bar in seconds.  Only affects some elements.
# Test on a case-by-case basis.  My setup is not affected.
set -g status-interval 15

set -g status-position bottom
set -g status-justify centre # this concerns the window list

# Two status lines so a blank row sits between the panes and the window pills
# (keeps the bubbles from butting up against the terminal output).  With the
# bar at the bottom, status-format[0] is the row next to the panes and [1] the
# screen-edge row, so we put the real bar on [1] and leave [0] empty.  The
# status-format[1] string is a verbatim copy of tmux 3.5a's built-in status
# default, so the left/right/window options and the mouse click-ranges all
# still apply — it just renders one line lower.
set -g status 2
set -g 'status-format[1]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g 'status-format[0]' ''

# NOTE the status bar has three components: left, right, centre.  The
# latter is hard-coded to the window list component.  So instead of
# status-centre, we have to modify the `window-status` (see below).
set -g status-left-length "100"
set -g status-right-length "100"

# Window status.  Always placed in the centre if `status-justify
# "centre"`.  Otherwise it floats next to either of the two remaining
# components of the status bar.  Colours — and the rounded "bubble" window
# formats (both window-status-format and window-status-current-format) — are
# set in the theme files sourced below, since the pill cap colours are
# theme-specific.  A single-space separator keeps adjacent pills apart.
#
# NOTE trigger alert to test bell: echo -e '\a'
set -g window-status-separator " "
set -g window-status-activity-style ""
set -g window-status-last-style ""

# }}}
# -------- Day/night theme {{{
# -----------------------------
# Colours come from a theme file chosen by ~/.config/theme/current
# ("light" → Latte, anything else → Mocha).  The `theme` shell command
# rewrites that file and re-sources the right one live.
set -g allow-passthrough on # let the iTerm2 SetColors escape pass through tmux
if-shell '[ "$(cat ~/.config/theme/current 2>/dev/null)" = light ]' \
  'source-file ~/.config/tmux/theme-light.conf' \
  'source-file ~/.config/tmux/theme-dark.conf'

# }}}
# -------- Plugins {{{
# --------------------

set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically install TPM plugin manager and it's plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Note: this should be the last line in the config file
run '~/.tmux/plugins/tpm/tpm'

# }}}
